scheduler:
  image:
    repository: company-brain/finance-scheduler
    tag: v1.0.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi
  env:
    - name: APP_ENV
      value: prod
    - name: POSTGRES_DSN
      valueFrom:
        secretKeyRef:
          name: finance-api-secrets
          key: postgres_dsn
