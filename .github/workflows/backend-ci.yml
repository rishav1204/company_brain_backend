name: backend-ci

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall app
      - name: Regulatory hardcode gate
        run: python ../../scripts/check_regulatory_hardcodes.py
      - name: Dependency security audit baseline
        run: python ../../scripts/security_audit.py
      - name: Benchmark eval release gate
        run: python ../../scripts/run_benchmark_eval.py --offline --output-path ../../eval-runs.json && python ../../scripts/eval_gate_check.py --eval-json-path ../../eval-runs.json
      - name: Architecture audit gate
        run: python ../../scripts/architecture_review_audit.py --fail-on-open
      - name: Implementation completeness audit gate
        run: python ../../scripts/implementation_completeness_audit.py --fail-on-critical-stubs --fail-on-unbounded
      - name: Secret pattern scan
        run: |
          if rg -n "sk-proj-[A-Za-z0-9_-]{20,}" backend --glob "!**/.env" --glob "!**/tests/**"; then
            echo "Potential API key found in repository"
            exit 1
          fi
      - name: Run tests
        run: pytest -q tests/test_architecture_remediation.py tests/test_security_remediation.py tests/test_implementation_completeness.py
  integration-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: company_brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d company_brain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend/apps/api
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run architecture audit
        run: python backend/scripts/architecture_review_audit.py --fail-on-open
      - name: Run migrations
        run: python backend/scripts/run_migrations.py --dsn "postgresql://postgres:postgres@localhost:5432/company_brain" --migrations-dir "backend/migrations"
      - name: Verify migration status
        run: python backend/scripts/migration_status.py --dsn "postgresql://postgres:postgres@localhost:5432/company_brain" --migrations-dir "backend/migrations"
      - name: Benchmark eval release gate (DB-backed)
        env:
          POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/company_brain
        run: python backend/scripts/run_benchmark_eval.py --org-id 11111111-1111-4111-8111-111111111111 --output-path backend/eval-runs-db.json && python backend/scripts/eval_gate_check.py --eval-json-path backend/eval-runs-db.json
      - name: Run integration-focused tests
        working-directory: backend/apps/api
        env:
          POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/company_brain
          REDIS_URL: redis://localhost:6379
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
        run: python -m pytest -q tests/test_architecture_remediation.py tests/test_migration_readiness.py tests/test_eventing_at_least_once.py tests/test_worker_topology.py tests/test_integration_event_chain.py tests/test_tenant_isolation_contracts.py tests/test_identity_and_embedding_workers.py tests/test_benchmark_eval_gate.py
