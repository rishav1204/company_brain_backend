openapi: 3.1.0
info:
  title: Company Brain Finance API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /me:
    get:
      summary: Get current user context
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current authenticated context
  /permissions/evaluate:
    get:
      summary: Evaluate policy for object/action
      parameters:
        - in: query
          name: object_type
          schema: { type: string }
          required: true
        - in: query
          name: object_id
          schema: { type: string }
          required: true
        - in: query
          name: action
          schema: { type: string }
          required: true
      responses:
        "200":
          description: Permission decision
  /auth/password/login:
    post:
      summary: Dev password login to mint JWT
      deprecated: true
      description: Prefer POST /auth/login when IAM_USE_DB_AUTH=true.
      responses:
        "200":
          description: JWT token response
  /auth/dev/create-user:
    post:
      summary: Dev helper to create login identity
      responses:
        "200":
          description: Dev user created response
  /sources:
    post:
      summary: Create source connector
      responses:
        "200": { description: Source created }
    get:
      summary: List source status
      responses:
        "200": { description: Sources list }
  /sources/{sourceId}/sync:
    post:
      summary: Trigger incremental sync
      parameters:
        - in: path
          name: sourceId
          schema: { type: string }
          required: true
      responses:
        "200": { description: Sync run created }
  /ingestion-runs:
    get:
      summary: List ingestion runs
      responses:
        "200": { description: Ingestion history }
  /query/context:
    post:
      summary: Retrieve context package
      responses:
        "200": { description: Context response }
  /query/explain:
    post:
      summary: Explain with citations and graph trace
      responses:
        "200": { description: Explain response }
  /documents/{id}/citations:
    get:
      summary: Retrieve citations for a document
      parameters:
        - in: path
          name: id
          schema: { type: string }
          required: true
      responses:
        "200": { description: Citation list }
  /workflows:
    get:
      summary: List workflows by filters
      deprecated: true
      description: Use GET /workflows/definitions (v2 workflow engine).
      responses:
        "200": { description: Workflows list }
  /workflows/{id}/actions:
    post:
      summary: Execute workflow action
      deprecated: true
      description: Use POST /workflows/start or POST /approvals/{approval_id}/decide.
      parameters:
        - in: path
          name: id
          schema: { type: string }
          required: true
      responses:
        "200": { description: Action accepted }
  /workflows/{id}/timeline:
    get:
      summary: Get workflow timeline
      deprecated: true
      description: Use GET /workflows/instances/{workflow_id}/audit (v2).
      parameters:
        - in: path
          name: id
          schema: { type: string }
          required: true
      responses:
        "200": { description: Timeline response }
  /workflows/definitions:
    get:
      summary: List workflow definitions (v2)
      responses:
        "200": { description: Workflow definitions }
  /workflows/start:
    post:
      summary: Start workflow instance (v2)
      responses:
        "200": { description: Workflow started }
  /decisions:
    post:
      summary: Record decision with rationale
      deprecated: true
      description: Use POST /finance-os/memory/write.
      responses:
        "200": { description: Decision created }
    get:
      summary: List decisions
      deprecated: true
      description: Use GET /finance-os/memory/summary.
      responses:
        "200": { description: Decision list }
  /memory:
    post:
      summary: Write curated memory
      deprecated: true
      description: Use POST /finance-os/memory/write.
      responses:
        "200": { description: Memory record created }
    get:
      summary: Retrieve memory by scope
      deprecated: true
      description: Use GET /finance-os/memory/search.
      responses:
        "200": { description: Memory list }
  /agents/run:
    post:
      summary: Trigger domain agent run
      deprecated: true
      description: Use POST /finance-os/agents/run.
      responses:
        "200": { description: Agent run started }
  /agents/runs/{runId}:
    get:
      summary: Get agent run state
      deprecated: true
      description: Use GET /finance-os/agents/executions/{execution_id}.
      parameters:
        - in: path
          name: runId
          schema: { type: string }
          required: true
      responses:
        "200": { description: Agent run state }
  /agents/runs/{runId}/approve:
    post:
      summary: Human approval gate
      deprecated: true
      description: Use finance-os agent workflow endpoints.
      parameters:
        - in: path
          name: runId
          schema: { type: string }
          required: true
      responses:
        "200": { description: Approval accepted }
  /graph/bootstrap:
    post:
      summary: Bootstrap finance graph (legacy)
      deprecated: true
      description: Use POST /finance-os/graph/rebuild.
      responses:
        "200": { description: Graph bootstrap started }
  /finance-os/agents/health:
    get:
      summary: Finance OS agents module health
      responses:
        "200": { description: Agents module health }
  /finance-os/agents/run:
    post:
      summary: Run finance OS agent (modular)
      responses:
        "200": { description: Agent run started }
  /finance-os/graph/health:
    get:
      summary: Finance OS graph module health
      responses:
        "200": { description: Graph module health }
  /finance-os/memory/health:
    get:
      summary: Finance OS memory module health
      responses:
        "200": { description: Memory module health }
  /audit/logs:
    get:
      summary: Immutable audit trail
      responses:
        "200": { description: Audit log list }
  /companies/{company_id}/invoices/{invoice_id}:
    get:
      summary: Get invoice by company scope
      parameters:
        - in: path
          name: company_id
          schema: { type: string }
          required: true
        - in: path
          name: invoice_id
          schema: { type: string }
          required: true
      responses:
        "200": { description: Company-scoped invoice response }
  /companies/{company_id}/invoices:
    post:
      summary: Create invoice in company scope
      parameters:
        - in: path
          name: company_id
          schema: { type: string }
          required: true
      responses:
        "200": { description: Invoice create response }
  /companies/{company_id}/workflows/{workflow_id}/actions:
    post:
      summary: Execute company-scoped workflow action
      parameters:
        - in: path
          name: company_id
          schema: { type: string }
          required: true
        - in: path
          name: workflow_id
          schema: { type: string }
          required: true
      responses:
        "200": { description: Workflow action policy result }
  /companies/{company_id}/reports/close-status:
    get:
      summary: Company close-status report
      parameters:
        - in: path
          name: company_id
          schema: { type: string }
          required: true
      responses:
        "200": { description: Close status summary }
  /metrics:
    get:
      summary: Runtime metrics snapshot
      responses:
        "200": { description: Metrics counters response }
  /events/recent:
    get:
      summary: Recent events for org
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
          required: false
      responses:
        "200": { description: Recent event list }
  /ingestion/runs/start:
    post:
      summary: Start ingestion run with trigger mode
      responses:
        "200": { description: Ingestion run started }
  /ingestion/runs/complete:
    post:
      summary: Complete ingestion run and reliability update
      responses:
        "200": { description: Ingestion run completed }
  /identity/resolve:
    post:
      summary: Resolve canonical identity from aliases
      responses:
        "200": { description: Identity resolution response }
  /queue/enqueue:
    post:
      summary: Enqueue event for async processing
      responses:
        "200": { description: Queue accepted response }
  /queue/process-next:
    post:
      summary: Process next queued event with dedupe and retry
      responses:
        "200": { description: Queue processing response }
  /memory/decay/run:
    post:
      summary: Apply memory lifecycle decay rules
      deprecated: true
      description: Use POST /finance-os/memory/admin/decay/run.
      responses:
        "200": { description: Memory decay summary }
  /erp/vouchers:
    get:
      summary: List vouchers
      responses:
        "200": { description: Voucher list }
    post:
      summary: Create voucher
      responses:
        "200": { description: Voucher created }
  /erp/vouchers/{voucher_id}:
    get:
      summary: Get voucher with lines
      parameters:
        - in: path
          name: voucher_id
          schema: { type: string }
          required: true
      responses:
        "200": { description: Voucher detail }
  /erp/vouchers/{voucher_id}/approve:
    post:
      summary: Approve voucher and generate journal
      parameters:
        - in: path
          name: voucher_id
          schema: { type: string }
          required: true
      responses:
        "200": { description: Voucher approved }
  /erp/vouchers/sales:
    post:
      summary: Create sales voucher
      responses:
        "200": { description: Sales voucher created }
  /erp/vouchers/purchase:
    post:
      summary: Create purchase voucher
      responses:
        "200": { description: Purchase voucher created }
  /billing/subscription:
    get:
      summary: Current org subscription and plan
      security:
        - bearerAuth: []
      responses:
        "200": { description: Subscription details }
  /billing/entitlements:
    get:
      summary: Enabled features for org
      security:
        - bearerAuth: []
      responses:
        "200": { description: Feature entitlements }
  /billing/usage:
    get:
      summary: Usage quotas and counters for current period
      security:
        - bearerAuth: []
      responses:
        "200": { description: Usage summary }
  /billing/credits:
    get:
      summary: AI credit wallet balance
      security:
        - bearerAuth: []
      responses:
        "200": { description: Credit balance }
  /billing/plans:
    get:
      summary: List available subscription plans
      security:
        - bearerAuth: []
      responses:
        "200": { description: Plan catalog }
  /admin/billing/plans:
    get:
      summary: Admin list plans
      security:
        - bearerAuth: []
      responses:
        "200": { description: Plan catalog }
  /admin/billing/subscriptions/assign:
    post:
      summary: Assign subscription plan to org
      security:
        - bearerAuth: []
      responses:
        "200": { description: Plan assigned }
  /admin/billing/credits/grant:
    post:
      summary: Grant AI credits to org
      security:
        - bearerAuth: []
      responses:
        "200": { description: Credits granted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
