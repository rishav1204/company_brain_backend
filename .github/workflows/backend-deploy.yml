name: backend-deploy



on:

  workflow_dispatch:

    inputs:

      environment:

        description: "target environment"

        required: true

        default: "staging"

      image_tag:

        description: "docker image tag"

        required: true

        default: "latest"



jobs:

  build-and-push:

    runs-on: ubuntu-latest

    permissions:

      contents: read

      packages: write

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image

        uses: docker/build-push-action@v6

        with:

          context: backend

          file: backend/Dockerfile

          push: true

          tags: ghcr.io/${{ github.repository }}/finance-api:${{ inputs.image_tag }}



  migrate-and-deploy:

    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Install helm

        uses: azure/setup-helm@v4

      - name: Install deploy tooling deps

        run: python -m pip install --upgrade pip && pip install psycopg[binary] httpx pyyaml

      - name: Plan migrations

        run: python backend/scripts/run_migrations.py --dsn "${{ secrets.POSTGRES_DSN }}" --migrations-dir "backend/migrations" --dry-run

      - name: Apply migrations

        run: python backend/scripts/run_migrations.py --dsn "${{ secrets.POSTGRES_DSN }}" --migrations-dir "backend/migrations"

      - name: Capture current Helm revision

        id: helm_rev

        run: |

          REV=$(helm history finance-api --max 1 -o json 2>/dev/null | python -c "import json,sys; data=json.load(sys.stdin); print(data[-1]['revision'] if data else 0)" || echo 0)

          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Helm upgrade/install finance platform

        run: |

          helm upgrade --install finance-api ./backend/charts \

            --namespace default \

            --set image.repository=ghcr.io/${{ github.repository }}/finance-api \

            --set image.tag=${{ inputs.image_tag }} \

            --set api.enabled=true \

            --set worker.enabled=true \

            --set scheduler.enabled=true \

            --values backend/charts/finance-api-values.yaml \

            --wait --timeout 10m

      - name: Smoke check deployment

        run: python backend/scripts/smoke_check.py --base-url "${{ secrets.FINANCE_API_BASE_URL }}"

      - name: Helm rollback on failure

        if: failure() && steps.helm_rev.outputs.revision != '0'

        run: helm rollback finance-api ${{ steps.helm_rev.outputs.revision }}

