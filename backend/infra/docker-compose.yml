version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: company-brain-postgres
    environment:
      POSTGRES_DB: company_brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: company-brain-redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5
    container_name: company-brain-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
